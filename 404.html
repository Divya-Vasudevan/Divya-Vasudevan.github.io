<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — Page Not Found · Divya Vasudevan</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

      <a href="index.html" class="nav__logo">DIVYA VASUDEVAN</a>

    </div>

  <footer class="footer">
    <div class="footer__inner">
      <span>© 2026 Divya Vasudevan</span>

    </div>
